; MixedTraffic Plugin – global defaults
; All values use SI units (meters, seconds, m/s, m/s²)
; Override per-project via UTrafficSettings (Project Settings → Mixed Traffic)

[/Script/MixedTraffic.TrafficSettings]

; ── Boundary response ──────────────────────────────────────────────────────
; Maximum lateral acceleration a boundary can apply [m/s²]
AccLatBMax=20.0
; Lateral acceleration when vehicle edge touches boundary [m/s²]
AccLatBRef=15.0
; Longitudinal deceleration when vehicle edge touches boundary [m/s²]
AccLongBRef=0.2
; Anticipation lookahead as a multiple of the vehicle's time gap T
AnticFactorB=2.0
; Longitudinal attenuation scale for wall–vehicle interaction [m]
S0yB=0.15
; Lateral attenuation scale for wall–vehicle interaction [m]
S0yLatB=0.20

; ── LOD thresholds (distance from player, in meters) ──────────────────────
; Enter full MTM 2-D mode when within this radius
LodFullRadius=100.0
; Drop back to background LOD outside this (hysteresis gap prevents flapping)
LodBackgroundRadius=150.0
